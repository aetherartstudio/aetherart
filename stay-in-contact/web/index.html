<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stay in contact — Aether Art</title>

<style>
  body{
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin:0;
    padding:40px 16px;
    background:#ffffff;
    color:#111827;
  }
  .card{
    max-width:520px;
    margin:0 auto;
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  h1{ font-size:22px; margin:0 0 8px; }
  p{ margin:0 0 16px; line-height:1.5; color:#374151; }
  label{ display:block; margin:12px 0 6px; font-size:13px; color:#374151; }
  input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #d1d5db;
    background:#ffffff;
    color:#111827;
    outline:none;
  }
  input:focus{
    border-color:#2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  button{
    margin-top:14px;
    width:100%;
    padding:12px;
    border-radius:10px;
    border:0;
    background:#2563eb;
    color:white;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{ filter: brightness(0.98); }
  .fine{ font-size:12px; color:#6b7280; margin-top:10px; }
  .hp{ position:absolute; left:-5000px; }
</style>
</head>

<body>
  <div class="card">
    <h1>Stay connected with Aether Art Gallery</h1>
    <p>
      Receive invitations and updates about future exhibitions and events.
    </p>

    <!-- MAILCHIMP FORM -->
   <form
  action="https://aetherart.us8.list-manage.com/subscribe/post?u=4434a1cd0cb9a08387da53087&id=d98f83e91a&f_id=00a705e1f0"
  method="post"
  target="_self"
  novalidate
  >

      <label for="mce-EMAIL">Email</label>
      <input type="email" name="EMAIL" id="mce-EMAIL" required />

      <label for="mce-FNAME">First name (optional)</label>
      <input type="text" name="FNAME" id="mce-FNAME" />

      <label for="mce-LNAME">Last name (optional)</label>
      <input type="text" name="LNAME" id="mce-LNAME" />

      <!-- Tag fallback -->
      <input type="hidden" name="tags" value="3403138" />

      <!-- BOT TRAP – MUST MATCH MAILCHIMP EXACTLY -->
      <div class="hp" aria-hidden="true">
        <input
          type="text"
          name="b_4434a1cd0cb9a08387da53087_d98f83e91a"
          tabindex="-1"
          value=""
        />
      </div>

      <button type="submit">Stay informed</button>

      <div class="fine">
        You can unsubscribe at any time. No spam
      </div>
    </form>
  </div>
</body>
</html>
